<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Filmek</title>
</head>
<body>
    <h1>Filmek</h1>
    <table class="table table-hover">
        <thead>
            <tr>
                <th>Title</th>
                <th>Year</th>
                <th>Genre</th>
                <th>Rating</th>
            </tr>
        </thead>
        <tbody id="tartalom">
        </tbody>
    </table>
    <h2>Űrlap</h2>
    <form style="font-size: 20px;" id ="form-id">
        <label for="title-for">Title:</label><br>
        <input type="text" id="input-title" name="title-name"><br>
        <label for="year-for">Year:</label><br>
        <input type="number" id="year-id" name="number-name"><br>
        <label for="genre-for">Genre:</label><br>
        <input type="text" id="genre-title" name="genre-name"><br>
        <label for="rating-for">Rating:</label><br>
        <input type="number" id="input-number" name="number-name" min="1" max="5" step="1"><br><br>
        <input type="submit" value="Submit">
    </form> 
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
